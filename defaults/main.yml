---
attic_service_name: 'attic'
attic_service_path: '/docker/{{ attic_service_name }}'
attic_service_compose: '{{ attic_service_path }}/docker-compose.yml'

attic_config_dir: '{{ attic_service_path }}/config'
attic_config_file: '{{ attic_config_dir }}/atticd.toml'
attic_config_cont_dir: '/etc/atticd'
attic_config_cont_file: '{{ attic_config_cont_dir }}/atticd.toml'

attic_network_name: 'attic'

# atticd
# Verified against GHCR on 2026-06-16:  latest main branch.
# To verify/bump:
# docker buildx imagetools inspect ghcr.io/zhaofengli/attic:main
attic_cont_name: '{{ attic_service_name }}-server'
attic_cont_digest: 'sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0'
attic_cont_image: 'ghcr.io/zhaofengli/attic@{{ attic_cont_digest }}'
attic_cont_port: 8080

# Secret
attic_token_hs256_secret_base64: ~

attic_db_host: 'attic-db'
attic_db_port: 5432
attic_db_name: 'attic'
attic_db_user: 'attic'
attic_db_pass: 'changeMeIfYouCare'

# Storage
attic_s3_region:     ~
attic_s3_bucket:     ~
attic_s3_endpoint:   ~
attic_s3_access_key: ~
attic_s3_secret_key: ~

# Chunking / dedup
attic_chunking_nar_size_threshold: 0  # Disable chunking
attic_chunking_min_size: 16384        # 16 KiB
attic_chunking_avg_size: 65536        # 64 KiB
attic_chunking_max_size: 262144       # 256 KiB

# Garbage collection
attic_gc_interval: '12 hours'
attic_gc_default_retention_period: '3 months'

# Cache provisioning
attic_api_url: 'http://127.0.0.1:{{ attic_cont_port }}'
attic_cache_store_dir: '/nix/store'
attic_cache_priority: 41
attic_cache_upstream_key_names: ['cache.nixos.org-1']
# attic_caches: ['ci', 'public']
attic_caches: []

# {{ attic_vault_tokens_path }}/<org>/<repo>/<cache>, e.g.:
#   attic_repos:
#     - { org: 'logos-co', name: 'logos-basecamp' }
attic_repos: []
attic_token_validity: '10 years'
# set attic_token_rotate=true to re-mint and overwrite the tokens in Vault
attic_token_rotate: false

attic_vault_kv_mount: 'secret'
attic_vault_tokens_path: '{{ env }}/{{ stage }}/tokens'
attic_vault_cli_chdir: '{{ playbook_dir }}/..'

# Github
attic_github_endpoint: 'https://{{ attic_domain }}'
attic_github_env: 'public-cache'
attic_github_secrets:
  ci:     { name: 'ATTIC_TOKEN_CI' }
  public: { name: 'ATTIC_TOKEN_PUBLIC', env: true }

# Container management
compose_recreate: 'auto'
compose_state: 'present'
compose_pull: 'always'
