---
- name: Attic | Create Consul service definition
  include_role: name=infra-role-consul-service
  vars:
    consul_config_name: '{{ attic_service_name }}'
    consul_services:
      - name: '{{ attic_service_name }}'
        tags: ['nix', 'cache', 'ci', 'misc']
        port: '{{ attic_cont_port }}'
        checks:
          - id: '{{ attic_service_name }}-status'
            name: Attic Healthcheck
            type: http
            http: 'http://localhost:{{ attic_cont_port }}/'
      - name: 'postgres-metrics'
        id:   '{{ attic_pg_exporter_cont_name }}'
        tags: ['postgres-metrics']
        port: '{{ attic_pg_exporter_port }}'
        address: '{{ ansible_local.wireguard.vpn_ip }}'
        checks:
          - id: '{{ attic_pg_exporter_cont_name }}-status'
            name: Attic Postgres Metrics Exporter
            type: tcp
            tcp: 'localhost:{{ attic_pg_exporter_port }}'
            failures_before_warning: 5
            failures_before_critical: 10
