---

- name: Attic | Check which consumer tokens exist in Vault
  command: >-
    vault kv get -field=jwt
    {{ attic_vault_kv_mount }}/{{ attic_vault_tokens_path }}/{{ item.0.org }}/{{ item.0.name }}/{{ item.1 }}
  args:
    chdir: '{{ attic_vault_cli_chdir }}'
  register: attic_token_present
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false
  loop: "{{ attic_repos | product(attic_caches) | list }}"
  loop_control:
    label: '{{ item.0.org }}/{{ item.0.name }}/{{ item.1 }}'
  no_log: true

- name: Attic | Mint missing or rotated per-repo consumer tokens
  command: >-
    docker exec {{ attic_cont_name }} atticadm -f {{ attic_config_cont_file }} make-token
    --sub attic-{{ item.0.org }}-{{ item.0.name }}-{{ item.1 }}
    --validity '{{ attic_token_validity }}' --push {{ item.1 }}
  register: attic_minted_tokens
  changed_when: false
  when: attic_token_rotate or attic_token_present.results[idx].rc != 0
  loop: "{{ attic_repos | product(attic_caches) | list }}"
  loop_control:
    index_var: idx
    label: '{{ item.0.org }}/{{ item.0.name }}/{{ item.1 }}'
  no_log: true

- name: Attic | Resolve current consumer tokens
  set_fact:
    attic_tokens: >-
      {{ attic_tokens | default([]) + [(
           attic_minted_tokens.results[idx].stdout
           if (attic_token_rotate or attic_token_present.results[idx].rc != 0)
           else attic_token_present.results[idx].stdout
         ) | trim] }}
  loop: "{{ attic_repos | product(attic_caches) | list }}"
  loop_control:
    index_var: idx
    label: '{{ item.0.org }}/{{ item.0.name }}/{{ item.1 }}'
  no_log: true

- name: Attic | Store new or rotated consumer tokens in Vault
  command: >-
    vault kv put
    {{ attic_vault_kv_mount }}/{{ attic_vault_tokens_path }}/{{ item.0.org }}/{{ item.0.name }}/{{ item.1 }}
    jwt={{ attic_tokens[idx] }}
  args:
    chdir: '{{ attic_vault_cli_chdir }}'
  when: attic_token_rotate or attic_token_present.results[idx].rc != 0
  delegate_to: localhost
  become: false
  loop: "{{ attic_repos | product(attic_caches) | list }}"
  loop_control:
    index_var: idx
    label: '{{ item.0.org }}/{{ item.0.name }}/{{ item.1 }}'
  no_log: true
